name = "gemini-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/frontend"
binding = "ASSETS"

# [[kv_namespaces]]
# binding = "CONFIG_KV"
