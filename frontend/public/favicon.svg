<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Master Aurora Gradient across Y to T -->
    <linearGradient id="ytFlowGrad" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="75%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- T-Specific Warm Accent Gradient -->
    <linearGradient id="tAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="45%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Glow Filter for Ambient Neon Aura -->
    <filter id="ytGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Core Fusion Highlight Filter -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="spark"/>
      <feComposite in="SourceGraphic" in2="spark" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing Aura Layer -->
  <g filter="url(#ytGlow)">
    <!-- Y Component: Left Arm -> Stem -->
    <path d="M 12 14 L 26 34 L 26 50" 
          stroke="url(#ytFlowGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          stroke-opacity="0.9"/>

    <!-- Y Right Branch leading to T Junction -->
    <path d="M 26 34 L 42 14" 
          stroke="url(#ytFlowGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          stroke-opacity="0.9"/>

    <!-- T Component: Horizontal Crossbar + Vertical Stem -->
    <path d="M 28 14 L 52 14" 
          stroke="url(#tAccentGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          stroke-opacity="0.95"/>

    <path d="M 42 14 L 42 50" 
          stroke="url(#tAccentGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          stroke-opacity="0.95"/>
  </g>

  <!-- Foreground Crisp Geometry Layer -->
  <!-- Y Letter -->
  <path d="M 12 14 L 26 34 L 26 50" 
        stroke="url(#ytFlowGrad)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <path d="M 26 34 L 42 14" 
        stroke="url(#ytFlowGrad)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- T Letter -->
  <path d="M 28 14 L 52 14" 
        stroke="url(#tAccentGrad)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <path d="M 42 14 L 42 50" 
        stroke="url(#tAccentGrad)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Micro Fusion Stars & Specular Highlights -->
  <!-- Junction between Y right arm and T top bar -->
  <circle cx="42" cy="14" r="2.2" fill="#FFFFFF" filter="url(#coreGlow)"/>
  <!-- Y intersection point -->
  <circle cx="26" cy="34" r="1.8" fill="#FFFFFF" fill-opacity="0.95"/>
  <!-- Terminal tip highlights -->
  <circle cx="12" cy="14" r="1.4" fill="#00F5FF"/>
  <circle cx="52" cy="14" r="1.4" fill="#F43F5E"/>
</svg>
