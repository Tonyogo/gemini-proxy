<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D14"/>
      <stop offset="100%" stop-color="#181326"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#818CF8"/>
      <stop offset="70%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Gemini Sparkle 4-point Star -->
  <path d="M32 9 C32 21.5 21.5 32 9 32 C21.5 32 32 42.5 32 55 C32 42.5 42.5 32 55 32 C42.5 32 32 21.5 32 9 Z" fill="url(#starGrad)" filter="url(#glow)"/>

  <!-- Center Energy Zap -->
  <path d="M34 20 L24 33.5 H31 L29 44 L40 30.5 H33 L35 20 Z" fill="#FFFFFF" fill-opacity="0.95"/>
</svg>
